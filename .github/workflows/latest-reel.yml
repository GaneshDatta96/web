name: Pull latest reel

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/pull-latest-reel.py
      - name: Commit the new reel
        run: |
          git add media/latest-reel.mp4 media/latest-reel.json
          if git diff --cached --quiet; then
            echo "Feed has no newer reel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the homepage reel from the Instagram feed."
          git push
